<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum | SalonGlow SaaS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 rounded-3xl border border-slate-800 p-8 shadow-2xl">
        
        <!-- HEADER -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center text-white text-2xl font-black mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="text-2xl font-black text-white">Şifremi Unuttum</h1>
            <p class="text-xs text-slate-400 mt-1">Kayıtlı e-posta adresinize 6 haneli doğrulama kodu gönderilecektir</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500/40 text-red-300 text-xs p-3 rounded-xl mb-4 font-semibold text-center">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs p-3.5 rounded-xl mb-4 font-semibold text-center leading-relaxed">
            {{ success }}
        </div>
        {% endif %}

        {% if step == 2 %}
        
        <!-- STEP 2 FORM: ENTER CODE AND NEW PASSWORD -->
        <form action="/reset-password" method="POST" class="space-y-4 text-xs">
            <input type="hidden" name="email" value="{{ email }}">
            
            <div>
                <label class="block font-extrabold text-slate-300 mb-1">6 Haneli E-posta Kodu</label>
                <input type="text" name="code" required value="" placeholder="123456" maxlength="6" class="w-full p-3.5 text-center text-lg font-mono font-bold tracking-widest rounded-2xl bg-slate-950 border border-slate-700 text-pink-400 focus:ring-2 focus:ring-pink-500 outline-none">
            </div>

            <div>
                <label class="block font-extrabold text-slate-300 mb-1">Yeni Şifreniz</label>
                <input type="password" name="new_password" required placeholder="Yeni şifrenizi girin" class="w-full p-3.5 rounded-2xl bg-slate-950 border border-slate-700 text-white font-semibold focus:ring-2 focus:ring-pink-500 outline-none">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-black text-sm rounded-2xl transition shadow-xl mt-2">
                Şifremi Güncelle <i class="fa-solid fa-check ml-1"></i>
            </button>
        </form>
        {% else %}
        <!-- STEP 1 FORM: ENTER REGISTERED EMAIL -->
        <form action="/forgot-password" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block font-extrabold text-slate-300 mb-1">Kayıtlı E-posta Adresiniz</label>
                <input type="email" name="email" required placeholder="nisa@guzellik.com" class="w-full p-3.5 rounded-2xl bg-slate-950 border border-slate-800 text-white font-semibold focus:ring-2 focus:ring-pink-500 outline-none">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-black text-sm rounded-2xl transition shadow-xl mt-2">
                Doğrulama Kodu Gönder <i class="fa-solid fa-paper-plane ml-1"></i>
            </button>
        </form>
        {% endif %}

        <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
            Şifrenizi hatırladınız mı? <a href="/login" class="text-pink-400 font-bold hover:underline">Giriş Yapın</a>
        </div>

    </div>

</body>
</html>
