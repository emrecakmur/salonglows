<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Girişi Yap | SalonGlow SaaS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 rounded-3xl border border-slate-800 p-8 shadow-2xl">
        
        <!-- HEADER -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center text-white text-2xl font-black mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h1 class="text-2xl font-black text-white">Salon<span class="text-pink-500">Glow</span> Giriş</h1>
            <p class="text-xs text-slate-400 mt-1">Salon yönetim panelinize erişmek için giriş yapın</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500/40 text-red-300 text-xs p-3 rounded-xl mb-4 font-semibold text-center">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs p-3.5 rounded-xl mb-4 font-semibold text-center leading-relaxed">
            {{ success }}
        </div>
        {% endif %}

        <!-- FORM -->
        <form action="/login" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block font-extrabold text-slate-300 mb-1">E-posta Adresi</label>
                <input type="email" name="email" required placeholder="demo@glamour.com" class="w-full p-3 rounded-2xl bg-slate-950 border border-slate-800 text-white font-semibold focus:ring-2 focus:ring-pink-500 outline-none">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block font-extrabold text-slate-300">Şifreniz</label>
                    <a href="/forgot-password" class="text-pink-400 hover:underline text-[11px] font-bold">Şifremi Unuttum?</a>
                </div>
                <input type="password" name="password" required placeholder="••••••••" class="w-full p-3 rounded-2xl bg-slate-950 border border-slate-800 text-white font-semibold focus:ring-2 focus:ring-pink-500 outline-none">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-black text-sm rounded-2xl transition shadow-xl mt-4">
                Panele Giriş Yap <i class="fa-solid fa-right-to-bracket ml-1"></i>
            </button>
        </form>

        <!-- DEMO LOGIN QUICK FILL -->
        <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs">
            <button onclick="document.getElementsByName('email')[0].value='demo@glamour.com'; document.getElementsByName('password')[0].value='123456';" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition border border-slate-700">
                ⚡ Demo Salon Hesabı İle Hızlı Giriş (demo@glamour.com)
            </button>

            <p class="mt-4 text-slate-400">
                Hesabınız yok mu? <a href="/register" class="text-pink-400 font-bold hover:underline">Hemen Ücretsiz Kaydolun</a>
            </p>
        </div>

    </div>

</body>
</html>
